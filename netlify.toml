# Opsi hosting HANYA aplikasi siswa (tanpa backend) di Netlify.
# Semua fitur belajar berjalan & bisa dipasang; gabung kelas/dasbor guru butuh backend terpisah
# (isi alamatnya di Pengaturan → Alamat server).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
